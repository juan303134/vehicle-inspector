services:
  - type: web
    name: vehicle-inspector-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_MODELS
        value: gpt-4.1-mini,gpt-4.1,gpt-5.4-mini,gpt-5.4-mini-2026-03-17,gpt-5-mini
      - key: VERIFY_ANALYSIS
        value: true
      - key: MIN_CONFIDENCE
        value: 0.45
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
